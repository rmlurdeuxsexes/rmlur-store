<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RMLUR :: deux SEXES — beats & kits</title>
<meta name="description" content="RMLUR Deux Sexes — buy beats and drum kits direct. No middleman.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- tiny corner nav, unobtrusive so the hero reads exactly like before -->
<div class="corner-nav">
  <a href="mailto:jayrewindbeatz@gmail.com">CONTACT</a>
  <a href="https://www.youtube.com/" target="_blank" rel="noopener">YOUTUBE</a>
  <a href="https://www.instagram.com/kennethglamour/" target="_blank" rel="noopener">IG</a>
</div>

<!-- ================= HERO — the real photo, untouched ================= -->
<section class="hero">
  <div class="hero-frame" id="hero-frame">
    <img src="assets/mpc-hero.jpg" alt="RMLUR MPC2000XL — buy beats here" id="hero-img">
    <!-- hotspots are positioned by app.js using window.HERO_HOTSPOTS -->
    <div id="hero-hotspots"></div>
  </div>
  <a href="#shop" class="scroll-cue" aria-label="Scroll to shop">Shop the catalog ↓</a>
</section>

<!-- popover shown when a hotspot is tapped -->
<div id="hotspot-card" class="hotspot-card" hidden>
  <button class="hc-close" id="hc-close" aria-label="Close">×</button>
  <div class="hc-type" id="hc-type"></div>
  <div class="hc-title" id="hc-title"></div>
  <div class="hc-sub" id="hc-sub"></div>
  <div class="hc-data" id="hc-data"></div>
  <div class="hc-row">
    <button class="hc-play" id="hc-play">► preview</button>
    <span class="hc-price" id="hc-price"></span>
    <a class="buy-btn" id="hc-buy" href="#" target="_blank" rel="noopener">BUY</a>
  </div>
</div>

<!-- ================= SHOP — full catalog, tape-label styled ================= -->
<main id="shop">
  <div class="shop-head">
    <h1>Shop</h1>
    <nav class="tabs" aria-label="Filter products">
      <button class="tab active" data-filter="all">All</button>
      <button class="tab" data-filter="beat">Beats</button>
      <button class="tab" data-filter="kit">Kits</button>
      <a class="tab tab-link" href="mailto:jayrewindbeatz@gmail.com?subject=Custom%20work">Custom</a>
    </nav>
  </div>

  <div id="tape-grid" class="tape-grid"></div>
  <p id="empty-state" class="empty-state" hidden>nothing here yet.</p>
</main>

<!-- ================= PLAYER BAR ================= -->
<div id="player-bar" class="player-bar" hidden>
  <button id="pb-play" class="transport-btn" aria-label="Play or pause preview">►</button>
  <button id="pb-stop" class="transport-btn" aria-label="Stop preview">■</button>
  <div class="pb-info">
    <span id="pb-title">—</span>
    <div class="pb-meter"><div id="pb-progress"></div></div>
  </div>
  <a id="pb-buy" class="buy-btn buy-btn-sm" href="#" target="_blank" rel="noopener">BUY</a>
</div>

<footer class="site-footer">
  <span>𝄃𝄃𝄂𝄂𝄀𝄁𝄃𝄂𝄂𝄃</span>
  <span>all sales final ▪ files delivered instantly after checkout</span>
  <span>jayrewindbeatz@gmail.com</span>
</footer>

<audio id="preview-audio"></audio>
<script src="products.js"></script>
<script src="app.js"></script>
</body>
</html>
